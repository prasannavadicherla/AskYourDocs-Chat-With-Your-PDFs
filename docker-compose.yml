services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docchat
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docchat"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/docchat
      CLIENT_ORIGIN: http://localhost:4000
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
